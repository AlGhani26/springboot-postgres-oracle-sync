server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_pg
    username: postgres
    password: 12345
  application:
    name: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: service-postgres
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.exploration.service.postgres.dto.PersonEvent
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
kafka:
  topic: sync-person-topic

  
